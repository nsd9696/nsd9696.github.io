<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#fef2f2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#fca5a5" stroke-width="2.5"/>
    </pattern>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#9ca3af"/>
    </marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#dc2626"/>
    </marker>
    <marker id="an" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#059669"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">Which inputs can reach a given output</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">The padded rows are discarded either way. Only one of these two schemes keeps them out of the answer.</text>

  <!-- ======================= LEFT: per-tensor ======================= -->
  <rect x="34" y="76" width="400" height="330" rx="8" fill="#fef7f7" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="52" y="100" font-size="14" font-weight="600" fill="#b91c1c">Per-tensor scale</text>
  <text x="52" y="118" font-size="11" fill="#6b7280">one amax over the whole buffer</text>

  <text x="96" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">ACTIVATIONS</text>
  <text x="368" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">OUTPUT</text>

  <!-- input rows -->
  <rect x="52" y="152" width="120" height="22" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="112" y="167" text-anchor="middle" font-size="11" fill="#1d4ed8">token 0</text>
  <rect x="52" y="180" width="120" height="22" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="112" y="195" text-anchor="middle" font-size="11" fill="#1d4ed8">token 1</text>
  <rect x="52" y="208" width="120" height="22" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="112" y="223" text-anchor="middle" font-size="11" fill="#1d4ed8">token 2</text>
  <rect x="52" y="236" width="120" height="22" rx="3" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="112" y="251" text-anchor="middle" font-size="11" fill="#b91c1c">pad</text>
  <rect x="52" y="264" width="120" height="22" rx="3" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="112" y="279" text-anchor="middle" font-size="11" fill="#b91c1c">pad</text>

  <!-- converge -->
  <line x1="174" y1="163" x2="212" y2="205" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ag)"/>
  <line x1="174" y1="191" x2="212" y2="207" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ag)"/>
  <line x1="174" y1="219" x2="212" y2="211" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ag)"/>
  <line x1="174" y1="247" x2="212" y2="216" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="174" y1="275" x2="212" y2="220" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="216" y="196" width="62" height="34" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="247" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">s</text>

  <!-- fan out -->
  <line x1="280" y1="205" x2="306" y2="163" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="280" y1="209" x2="306" y2="191" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="280" y1="213" x2="306" y2="219" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="308" y="152" width="120" height="22" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="368" y="167" text-anchor="middle" font-size="11" fill="#b91c1c">out 0</text>
  <rect x="308" y="180" width="120" height="22" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="368" y="195" text-anchor="middle" font-size="11" fill="#b91c1c">out 1</text>
  <rect x="308" y="208" width="120" height="22" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="368" y="223" text-anchor="middle" font-size="11" fill="#b91c1c">out 2</text>
  <rect x="308" y="236" width="120" height="50" rx="3" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="368" y="266" text-anchor="middle" font-size="10" fill="#9ca3af">sliced off</text>

  <text x="52" y="322" font-size="11.5" fill="#374151">Every arrow into s is also an arrow out of it.</text>
  <text x="52" y="340" font-size="11.5" font-weight="600" fill="#b91c1c">Stale bytes in the pad rows land in out 0.</text>
  <text x="52" y="362" font-size="11" fill="#6b7280">Reduction order is irrelevant here, so batch-invariant</text>
  <text x="52" y="378" font-size="11" fill="#6b7280">kernels leave this path exactly as it is.</text>

  <!-- ======================= RIGHT: per-token ======================= -->
  <rect x="466" y="76" width="400" height="330" rx="8" fill="#f6fdf9" stroke="#86efac" stroke-width="1.5"/>
  <text x="484" y="100" font-size="14" font-weight="600" fill="#047857">Per-token scale</text>
  <text x="484" y="118" font-size="11" fill="#6b7280">one amax per row</text>

  <text x="528" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">ACTIVATIONS</text>
  <text x="800" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">OUTPUT</text>

  <rect x="484" y="152" width="120" height="22" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="544" y="167" text-anchor="middle" font-size="11" fill="#1d4ed8">token 0</text>
  <rect x="484" y="180" width="120" height="22" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="544" y="195" text-anchor="middle" font-size="11" fill="#1d4ed8">token 1</text>
  <rect x="484" y="208" width="120" height="22" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="544" y="223" text-anchor="middle" font-size="11" fill="#1d4ed8">token 2</text>
  <rect x="484" y="236" width="120" height="22" rx="3" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="544" y="251" text-anchor="middle" font-size="11" fill="#b91c1c">pad</text>
  <rect x="484" y="264" width="120" height="22" rx="3" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="544" y="279" text-anchor="middle" font-size="11" fill="#b91c1c">pad</text>

  <line x1="606" y1="163" x2="626" y2="163" stroke="#059669" stroke-width="1.5" marker-end="url(#an)"/>
  <line x1="606" y1="191" x2="626" y2="191" stroke="#059669" stroke-width="1.5" marker-end="url(#an)"/>
  <line x1="606" y1="219" x2="626" y2="219" stroke="#059669" stroke-width="1.5" marker-end="url(#an)"/>
  <line x1="606" y1="247" x2="626" y2="247" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="606" y1="275" x2="626" y2="275" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="628" y="152" width="46" height="22" rx="3" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="651" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">s[0]</text>
  <rect x="628" y="180" width="46" height="22" rx="3" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="651" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">s[1]</text>
  <rect x="628" y="208" width="46" height="22" rx="3" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="651" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">s[2]</text>
  <rect x="628" y="236" width="46" height="22" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="651" y="251" text-anchor="middle" font-size="11" fill="#b91c1c">s[3]</text>
  <rect x="628" y="264" width="46" height="22" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="651" y="279" text-anchor="middle" font-size="11" fill="#b91c1c">s[4]</text>

  <line x1="676" y1="163" x2="738" y2="163" stroke="#059669" stroke-width="1.5" marker-end="url(#an)"/>
  <line x1="676" y1="191" x2="738" y2="191" stroke="#059669" stroke-width="1.5" marker-end="url(#an)"/>
  <line x1="676" y1="219" x2="738" y2="219" stroke="#059669" stroke-width="1.5" marker-end="url(#an)"/>
  <line x1="676" y1="247" x2="738" y2="247" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#ar)"/>
  <line x1="676" y1="275" x2="738" y2="275" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#ar)"/>

  <rect x="740" y="152" width="120" height="22" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="800" y="167" text-anchor="middle" font-size="11" fill="#047857">out 0</text>
  <rect x="740" y="180" width="120" height="22" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="800" y="195" text-anchor="middle" font-size="11" fill="#047857">out 1</text>
  <rect x="740" y="208" width="120" height="22" rx="3" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
  <text x="800" y="223" text-anchor="middle" font-size="11" fill="#047857">out 2</text>
  <rect x="740" y="236" width="120" height="50" rx="3" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="800" y="266" text-anchor="middle" font-size="10" fill="#9ca3af">sliced off</text>

  <text x="484" y="322" font-size="11.5" fill="#374151">The pad rows still carry stale bytes.</text>
  <text x="484" y="340" font-size="11.5" font-weight="600" fill="#047857">Their scales leave with them.</text>
  <text x="484" y="362" font-size="11" fill="#6b7280">Nothing you write into the pad region has a path</text>
  <text x="484" y="378" font-size="11" fill="#6b7280">to out 0, out 1, or out 2.</text>

  <text x="450" y="432" text-anchor="middle" font-size="11.5" fill="#6b7280">The scale is the only thing that changes. It decides whether the buffer's unused tail is part of the answer.</text>
</svg>
