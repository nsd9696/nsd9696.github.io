<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // apply saved theme before paint to avoid flash
    (function(){ var t='light'; try{ t=localStorage.getItem('theme')||'light'; }catch(e){} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <title>{% if page.title %}{{ page.title | strip_html }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,380;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <div class="head-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-name">{{ site.title }}</span>
        <span class="brand-tag">{{ site.tagline }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">About</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="https://x.com/lucas_nam96">X</a>
        <a href="https://www.linkedin.com/in/lucas-sangdae-nam-635a36193/">LinkedIn</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
          <span class="icon-light">☀</span><span class="icon-dark">☾</span>
        </button>
      </nav>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-foot">
    <div class="foot-wrap">© Lucas Nam — all opinions my own.</div>
  </footer>
  <script src="{{ '/assets/js/toc.js' | relative_url }}"></script>
</body>
</html>
